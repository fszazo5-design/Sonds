name: Apply Neon migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonds-neon-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify migration secret is configured
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          if [[ -z "$NEON_DATABASE_URL" ]]; then
            echo "Missing GitHub Actions secret: NEON_DATABASE_URL" >&2
            exit 1
          fi

      - name: Apply all idempotent schema migrations
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for migration in backend/migrations/*.sql; do
            echo "Applying $migration"
            psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --file="$migration"
          done
