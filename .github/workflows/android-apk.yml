name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies and build React assets
        run: |
          npm ci
          npm run build

      - name: Restore the app signing key used by installed builds
        if: github.ref_type == 'tag'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build APK
        working-directory: android
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            APP_VERSION="$REF_NAME"
          else
            APP_VERSION="1.0.$RUN_NUMBER"
          fi
          APP_VERSION_CODE=$((1000 + RUN_NUMBER))
          ./gradlew --no-daemon assembleDebug \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Sonds.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum Sonds.apk > Sonds.apk.sha256

      - name: Save APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonds-Android-APK
          path: |
            Sonds.apk
            Sonds.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for OTA updates
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" Sonds.apk Sonds.apk.sha256 \
            --title "توتي $REF_NAME" \
            --generate-notes
